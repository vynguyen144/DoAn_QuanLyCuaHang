name: Build Windows 64-bit app

on:
  workflow_dispatch:
  push:
    branches:
      - feature/inventory-invoices-statistics
    paths:
      - '**.java'
      - 'pom.xml'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/inventory-invoices-statistics

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build application
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Package Windows app with bundled Java runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          if (!(Test-Path "target/QuanLyCuaHang.jar")) {
            throw "Không tìm thấy target/QuanLyCuaHang.jar sau khi Maven build."
          }
          jpackage --type app-image --name QuanLyCuaHang --input target --main-jar QuanLyCuaHang.jar --main-class ui.DesktopApp --dest release
          Compress-Archive -Path release/QuanLyCuaHang -DestinationPath release/QuanLyCuaHang-windows-x64.zip

      - name: Upload Windows 64-bit app
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyCuaHang-windows-x64
          path: release/QuanLyCuaHang-windows-x64.zip
          if-no-files-found: error
