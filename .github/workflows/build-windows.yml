name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    branches: [ feature/desktop-gui ]
    paths:
      - '**.java'
      - 'pom.xml'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/desktop-gui
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package application
        run: mvn -B clean package
      - name: Create portable app image
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 256, 256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::FromArgb(12, 29, 72))
          $teal = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(23, 190, 190))
          $orange = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(255, 174, 54))
          $cream = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(255, 244, 220))
          $g.FillRectangle($teal, 52, 46, 152, 24)
          $g.FillPolygon($orange, @([System.Drawing.Point]::new(38,88),[System.Drawing.Point]::new(218,88),[System.Drawing.Point]::new(198,120),[System.Drawing.Point]::new(58,120)))
          $g.FillRectangle($cream, 60, 116, 136, 76)
          $g.FillRectangle($teal, 145, 132, 32, 32)
          $g.FillRectangle($orange, 112, 158, 68, 56)
          $icon = [System.Drawing.Icon]::FromHandle($bmp.GetHicon())
          $stream = [System.IO.File]::Create("$PWD/release/app.ico")
          $icon.Save($stream); $stream.Dispose(); $icon.Dispose(); $g.Dispose(); $bmp.Dispose()
          jpackage --type app-image --name QuanLyCuaHang --input target --main-jar QuanLyCuaHang.jar --main-class ui.DesktopApp --icon release/app.ico --dest release
          Compress-Archive -Path release/QuanLyCuaHang -DestinationPath release/QuanLyCuaHang-windows-x64.zip
      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyCuaHang-windows-x64
          path: release/QuanLyCuaHang-windows-x64.zip
          if-no-files-found: error
